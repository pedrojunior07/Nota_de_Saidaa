stages:
  - environment
  - build
  - security
  - test
  - post
  - deploy
  - release


variables:
  # Application settings
  APP_NAME: "$CI_PROJECT_NAME"

  # Registry settings
  DOCKER_NAME: "nexus.standardbank.co.mz:7777/$CI_PROJECT_NAME"
  NEXUS_REPO: nexus.standardbank.co.mz:7777
  SONAR_HOST_URL: "https://sonar.standardbank.co.mz"
  VARIABLE_SCOPE_UAT: "uat" 
  VARIABLE_SCOPE_SIT: "sit"
  VARIABLE_SCOPE_PROD: "prod"



version:
  stage: environment
  script:
    - VERSION_MAJOR=1
    - VERSION_MINOR=1
    - VERSION_PATCH=0
    - VERSION_SUFFIX=mr
    - |
      case "$CI_COMMIT_BRANCH" in
        master|main) VERSION_SUFFIX=prod ;;
        develop) VERSION_SUFFIX=dev ;;
        release/*) VERSION_SUFFIX=rc ;;
      esac
    - git fetch --tags --force >/dev/null 2>&1 || true
    - |
      LATEST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || true)
      if [ -n "$LATEST_TAG" ]; then
        TAG_VERSION=${LATEST_TAG#v}
        VERSION_MAJOR=$(echo $TAG_VERSION | cut -d. -f1)
        VERSION_MINOR=$(echo $TAG_VERSION | cut -d. -f2)
        VERSION_PATCH=$(echo $TAG_VERSION | cut -d. -f3)
        VERSION_PATCH=$((VERSION_PATCH + 1))
      fi
    - VERSION="$VERSION_MAJOR.$VERSION_MINOR.$VERSION_PATCH"
    - APP_VERSION="$VERSION-$VERSION_SUFFIX-$CI_COMMIT_SHORT_SHA"
    - echo "export VERSION=$VERSION" > .variables
    - echo "export APP_VERSION=$APP_VERSION" >> .variables
    - cat .variables
  artifacts:
    paths:
      - .variables
      - ./version.properties
    expire_in: 1 hour
  tags:
    - sbmz-docker-base-test


# Build container image (Python optimized)
docker-build:
  stage: build
  image: nexus.standardbank.co.mz:7777/docker:cli
  services:
    - docker:dind
  dependencies:
    - version
  before_script:
    - source .variables
    - docker info
    - echo "Building Python-optimized version $APP_VERSION"
  script:
    - |
      # Build Python-optimized image with multiple tags
      docker build \
        --build-arg VERSION="$VERSION" \
        --build-arg BUILD_NUMBER="$BUILD_NUMBER" \
        --build-arg GIT_COMMIT="$CI_COMMIT_SHA" \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t "$DOCKER_NAME:$APP_VERSION" \
        -t "$DOCKER_NAME:$VERSION" \
        -t "$DOCKER_NAME:latest" \
        -f Dockerfile .
    - docker images | grep "$CI_PROJECT_NAME"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "sbmz-dev" ||  $CI_COMMIT_BRANCH == "sbmz-sit" ||  $CI_COMMIT_BRANCH == "sbmz-uat"'
  tags:
    - sbmz-shell-L
  artifacts:
    paths:
      - .variables
      - ./version.properties
    expire_in: 1 hour




upload-to-nexus:
  stage: post
  needs: [ "docker-build","version" ]
  image: docker:latest
  script:
    - docker login -u $NEXUS_USER -p $NEXUS_PASSWORD $NEXUS_REPO
    - source .variables
    #    - docker build -t $DOCKER_NAME:$VERSION -t $DOCKER_NAME:latest -f Dockerfile .
    - docker push $DOCKER_NAME:$VERSION
    - docker push $DOCKER_NAME:latest
    - echo $DOCKER_NAME:$VERSION $DOCKER_NAME:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "sbmz-uat" || $CI_COMMIT_BRANCH == "sbmz-sit" ||  $CI_COMMIT_BRANCH == "sbmz-dev"' 
  tags:
    - sbmz-shell-L
  artifacts:
    paths:
      - .variables
      - ./version.properties




# ========================
# SAST — SonarQube
# ========================
sast-sonarqube:
  tags: 
    - sbmz-docker-base-test
  stage: security
  needs: ["docker-build"]
  image:
    name: nexus.standardbank.co.mz:7777/sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    SONAR_PROJECT_KEY: "${CI_PROJECT_PATH_SLUG}"
    SONAR_PROJECT_NAME: "${CI_PROJECT_NAME}"
    SONAR_PROJECT_VERSION: "${CI_COMMIT_SHORT_SHA}"
    JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=$CI_PROJECT_DIR/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - echo "$SONAR_CA_CERT" > sonar-ca.crt
    - cp "$JAVA_HOME/lib/security/cacerts" "$CI_PROJECT_DIR/cacerts"
    - chmod 666 "$CI_PROJECT_DIR/cacerts"
    - keytool -importcert -noprompt -alias sonar-ca -keystore "$CI_PROJECT_DIR/cacerts" -storepass changeit -file sonar-ca.crt
  script:
    - sonar-scanner
      -Dsonar.projectKey=${SONAR_PROJECT_KEY}
      -Dsonar.projectName=${SONAR_PROJECT_NAME}
      -Dsonar.projectVersion=${SONAR_PROJECT_VERSION}
      -Dsonar.sources=.
      -Dsonar.exclusions=**/.venv/**,**/venv/**,**/__pycache__/**,**/*.pyc
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.python.version=3.11
      -Dsonar.qualitygate.wait=true
      -Dsonar.branch.name=${CI_COMMIT_REF_NAME}
      -Djavax.net.ssl.trustAll=true
  allow_failure: false
  artifacts:
    paths:
      - target/*
      - .variables


# Deploy to development
deploy-dev:
  stage: deploy
  needs:
    - upload-to-nexus
  environment:
    name: development
  script:
    - ssh-keyscan $REMOTE_DEV >> ~/.ssh/known_hosts
    - echo "Deploying to development environment..."
    - ssh $USER@$REMOTE_DEV "mkdir -p /application/$CI_PROJECT_NAME/config"
    - ssh $USER@$REMOTE_DEV "mkdir -p /application/$CI_PROJECT_NAME/logs && chmod 777 /application/$CI_PROJECT_NAME/logs"
    - ssh $USER@$REMOTE_DEV "mkdir -p /application/$CI_PROJECT_NAME/nginx"
    - ssh $USER@$REMOTE_DEV "mkdir -p /application/$CI_PROJECT_NAME/ssl"
    - scp ./docker-compose.yml $USER@$REMOTE_DEV:/application/$CI_PROJECT_NAME/
#    - scp ./nginx/* $USER@$REMOTE_DEV:/application/$CI_PROJECT_NAME/nginx/
    - ssh $USER@$REMOTE_DEV "
        cd /application/$CI_PROJECT_NAME/ &&
        docker login -u $NEXUS_USER -p $NEXUS_PASSWORD $NEXUS_REPO &&
        docker rmi -f $DOCKER_NAME &&
        docker compose pull &&
        docker compose down || true &&
        docker compose up -d"
    - echo "Deployment completed successfully"
  tags:
    - sbmz-docker-base-test
  rules:
    - if: '$CI_COMMIT_BRANCH == "sbmz-dev"'

