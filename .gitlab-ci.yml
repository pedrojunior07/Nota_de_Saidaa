    - sshpass -p $PASS_UAT scp ./.env $USER_UAT@$REMOTE_UAT:/application/$CI_PROJECT_NAME/
    - sshpass -p $PASS_UAT scp ./docker-compose.yml $USER_UAT@$REMOTE_UAT:/application/$CI_PROJECT_NAME/
