<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Erro{% endblock %} · Nota de Saída</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ asset('css/style.css') }}" rel="stylesheet">
</head>
<body class="login-body">
    <div class="error-box">
        <span class="brand-mark">STD Bank</span>
        <h1>{% block code %}Erro{% endblock %}</h1>
        <p>{% block message %}Ocorreu um erro.{% endblock %}</p>
        {% if current_user.is_authenticated and current_user.is_admin() %}
        <a href="{{ url_for('admin.utilizadores') }}" class="btn btn-navy">Voltar ao início</a>
        {% elif current_user.is_authenticated %}
        <a href="{{ url_for('modulos.escolher') }}" class="btn btn-navy">Voltar ao início</a>
        {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn btn-navy">Voltar ao início</a>
        {% endif %}
    </div>
</body>
</html>
