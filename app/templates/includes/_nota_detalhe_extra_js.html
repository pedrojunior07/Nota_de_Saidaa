{% if nota.pode_gerir_assinaturas(current_user) or nota.pode_aprovar(current_user) %}
<script src="{{ asset('js/signature_zones.js') }}"></script>
{% endif %}
{% if (_recolher_entrega or _recolher_recebido) and nota.pode_gerir_assinaturas(current_user) %}
<script src="{{ asset('vendor/sigcaptx/base64.js') }}"></script>
<script src="{{ asset('vendor/sigcaptx/wgssSigCaptX.js') }}"></script>
<script id="wacomSigCaptxMeta" type="application/json">{{ wacom_sigcaptx | tojson }}</script>
<script src="{{ asset('js/wacom_sigpad.js') }}"></script>
<script src="{{ asset('js/signature_capture.js') }}"></script>
{% endif %}
{% if nota.pode_aprovar(current_user) %}
<script id="aprovadorPreviewMeta" type="application/json">{{ {
    "notaId": nota.id,
    "uploadUrl": url_for("notas.upload_minha_assinatura"),
    "deleteUrl": url_for("notas.apagar_minha_assinatura"),
    "assinaturaUrl": url_assinatura(current_user.assinatura_path)
} | tojson }}</script>
<script src="{{ asset('js/signature_aprovacao.js') }}"></script>
{% endif %}
