services:
  automacao_nota_de_saida:
    image: nexus.standardbank.co.mz:7777/automacao_nota_de_saida:1.1.0
    ports:
      - "5005:5000"
    env_file:
      - .env
    # Valores fixos para todos os ambientes: têm prioridade sobre o .env do
    # servidor (que não está no repositório). O login usa a password do AD
    # através do endpoint interno do banco.
    environment:
      - AUTH_MODE=api
      - AUTH_API_URL=http://10.245.207.70:99/authenticator/login
      - AUTH_API_CHANNEL=RAO
      # Backup das notas concluídas: valores vêm das variáveis CI/CD do GitLab
      # (o deploy passa-os ao docker compose). Vazio = desligado.
      - BACKUP_MODE=${BACKUP_MODE:-desligado}
      - BACKUP_WEBHOOK_URL=${BACKUP_WEBHOOK_URL:-}
      - BACKUP_PASTA=${BACKUP_PASTA:-}
    logging:
      driver: loki
      options:
        loki-url: "http://10.245.87.86:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-timeout: "10s"
        loki-retries: "5"
    volumes:
      - /application/automacao_nota_de_saida/logs:/app/logs
      - app_instance:/app/instance
      - app_sessions:/app/flask_session
    networks:
      - stb-network
    depends_on:
      - mongodb_nota_saida
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  mongodb_nota_saida:
    image: nexus.standardbank.co.mz:7777/mongo:8.3
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=nota_saida
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - stb-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional) — disabled: no nginx/ config in repo yet
  # nginx:
  #   image: nexus.standardbank.co.mz:7777/nginx
  #   ports:
  #     - "83:80"
  #     - "5000:5000"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   networks:
  #     - stb-network
  #   depends_on:
  #     - automacao_nota_de_saida
  #   restart: unless-stopped

networks:
  stb-network:
    driver: bridge

volumes:
  app_instance:
    driver: local
  app_sessions:
    driver: local
  mongo_data:
    driver: local